name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # 22.04 to match the release job's package set (libappindicator3-dev).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Stand in for the build inputs tauri checks at compile time
        # `generate_context!` embeds `frontendDist` and tauri-build verifies the
        # yt-dlp sidecar exists. Neither is exercised by lint or tests, so
        # placeholders keep the job off the frontend build and the network.
        run: |
          mkdir -p dist && echo '<!doctype html>' > dist/index.html
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/yt-dlp-x86_64-unknown-linux-gnu

      - name: rustfmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: tests
        working-directory: src-tauri
        run: cargo test --locked

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: type-check
        run: pnpm type-check

      - name: tests
        run: pnpm test:run
