[package]
name = "audiogram"
version = "0.2.10"
description = "Local Audio Player"
authors = ["Eg0r0k"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "audiogram_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = { version = "2.0.0", features = ["watch"] }
tauri-plugin-dialog = "2"
time = { version = "0.3", features = ["formatting"] }
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "stream", "socks"] }
tokio = { version = "1", features = ["fs", "io-util", "net", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
# Loopback media server: every crate below is already in the dependency tree
# (via reqwest/tauri) — these lines only make them direct dependencies.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
getrandom = "0.3"
hex = "0.4"
lofty = "0.24.0"
log = "0.4.33"
# ALAC-in-mp4 cannot be decoded by any Chromium webview (desktop WebView2 or
# Android); the media server transcodes such files to WAV on the fly.
symphonia = { version = "0.5", default-features = false, features = ["alac", "isomp4"] }
hound = "3.5"
ape-decoder = "0.3"
percent-encoding = "2"
tauri-plugin-http = "2.5.9"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
redundant_clone = "warn"
needless_collect = "warn"
uninlined_format_args = "warn"
manual_ok_or = "warn"
map_unwrap_or = "warn"
unnecessary_wraps = "warn"
clone_on_ref_ptr = "warn"
large_futures = "warn"

# Unoptimized decoders run ~10x slower than what playback UX tolerates
# (12s/track ALAC, ~8x realtime APE measured); keep them fast in dev builds.
[profile.dev.package.symphonia-core]
opt-level = 3
[profile.dev.package.symphonia-codec-alac]
opt-level = 3
[profile.dev.package.symphonia-format-isomp4]
opt-level = 3
[profile.dev.package.ape-decoder]
opt-level = 3

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# rquickjs (via rustypipe) ships no prebuilt bindings for mobile targets;
# the youtube module that needs it is desktop-only anyway.
rustypipe = { version = "0.11.4", default-features = false, features = ["rustls-tls-webpki-roots"] }
discord-rich-presence = "1.1.0"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.10.0"
tauri-plugin-window-state = "2"

[target.'cfg(windows)'.dependencies]
# Taskbar thumbnail toolbar (ITaskbarList3) — the same crate version tauri
# already pulls in, so the HWND types line up without conversion.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

