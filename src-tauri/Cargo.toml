[package]
name = "audiogram"
version = "0.2.3"
description = "Local Audio Player"
authors = ["Eg0r0k"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "audiogram_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = { version = "2.0.0", features = ["watch"] }
tauri-plugin-dialog = "2"
time = { version = "0.3", features = ["formatting"] }
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "stream", "socks"] }
tokio = { version = "1", features = ["fs", "io-util", "net", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
# Loopback media server: every crate below is already in the dependency tree
# (via reqwest/tauri) — these lines only make them direct dependencies.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
getrandom = "0.3"
hex = "0.4"
lofty = "0.24.0"
log = "0.4.33"
percent-encoding = "2"
tauri-plugin-http = "2.5.9"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# rquickjs (via rustypipe) ships no prebuilt bindings for mobile targets;
# the youtube module that needs it is desktop-only anyway.
rustypipe = { version = "0.11.4", default-features = false, features = ["rustls-tls-webpki-roots"] }
discord-rich-presence = "1.1.0"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.10.0"
tauri-plugin-window-state = "2"

